<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentica</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <div id="app">
    <div id="content">
      <!-- Sidebar: session list -->
      <aside id="sidebar">
        <div id="sidebar-header">
          <div id="settings-dropdown" class="dropdown">
            <button id="btn-settings" title="Menu" aria-label="Menu" aria-haspopup="true" aria-expanded="false">
              <img src="icons/menu.svg" alt="" aria-hidden="true" width="20" height="20"/>
            </button>
            <div class="dropdown-menu" role="menu" aria-labelledby="btn-settings">
              <button class="dropdown-item" id="menu-settings" role="menuitem">Settings</button>
              <button class="dropdown-item" id="menu-debug-log" role="menuitem">Debug Log</button>
            </div>
          </div>
          <span class="app-name">Agentica</span>
          <button id="btn-new-session" title="New session">+</button>
        </div>
        <ul id="session-list"></ul>
      </aside>

      <!-- Main: chat pane -->
      <main id="main">
        <div id="chat-header">
          <button id="btn-toggle-sidebar" title="Toggle sidebar" aria-label="Toggle sidebar">
            <img src="icons/sidebar-toggle.svg" alt="" aria-hidden="true" width="20" height="20"/>
          </button>
          <div id="chat-title-group">
            <button id="chat-title" type="button" title="Rename session">Select or create a session</button>
            <span id="chat-path"></span>
            <span id="chat-created"></span>
          </div>
        </div>

        <div id="messages"></div>

        <div id="input-area">
          <textarea id="msg-input" placeholder="Message…" rows="3" disabled></textarea>
          <button id="btn-send" disabled>Send</button>
        </div>
      </main>
    </div>

    <div id="status-line" style="display:none"></div>
  </div>

  <div id="settings-modal">
    <div class="modal-box">
      <h2>Settings</h2>
      <form id="settings-form">
        <label for="settings-theme">Theme</label>
        <select id="settings-theme">
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
        <label for="settings-server-url" style="margin-top:12px">Server URL</label>
        <input type="text" id="settings-server-url" placeholder="http://172.23.64.1:1234" />
        <label for="settings-model-name" style="margin-top:12px">Model</label>
        <input type="text" id="settings-model-name" placeholder="mistralai/ministral-3-14b-reasoning" />
        <label for="settings-api-mode" style="margin-top:12px">API Mode</label>
        <select id="settings-api-mode">
          <option value="chatcompletions">Chat Completions API (default)</option>
          <option value="responses">Responses API</option>
        </select>
        <label for="settings-show-status-line" style="margin-top:12px">
          <input type="checkbox" id="settings-show-status-line" />
          Show status line
        </label>
        <div class="modal-actions">
          <button type="button" id="settings-cancel">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <div id="rename-session-modal">
    <div class="modal-box">
      <h2>Rename Session</h2>
      <form id="rename-session-form">
        <label for="rename-session-title">Title</label>
        <input id="rename-session-title" type="text" required />
        <div class="modal-actions">
          <button type="button" id="rename-session-cancel">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- New session modal -->
  <div id="new-session-modal">
    <div class="modal-box">
      <h2>New Session</h2>
      <form id="new-session-form">
        <label for="new-session-title">Name</label>
        <input id="new-session-title" type="text" placeholder="My project" required />
        <label for="new-session-path">Working folder <span class="label-hint">(optional — paste a full path)</span></label>
        <div class="path-row">
          <input id="new-session-path" type="text" placeholder="C:\Users\sam\projects\mywork" />
          <button type="button" id="btn-browse-folder" title="Pick folder">Browse</button>
        </div>
        <input id="folder-picker" type="file" webkitdirectory style="display:none" />
        <div class="modal-actions">
          <button type="button" id="new-session-cancel">Cancel</button>
          <button type="submit">Create</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Permission Modal -->
  <div id="permission-modal">
    <div class="modal-box">
      <h2>Permission Required</h2>
      <p id="permission-message">A tool is requesting access to a file.</p>
      <div id="permission-details">
        <div class="permission-detail-row">
          <span class="permission-label">Tool:</span>
          <span id="permission-tool" class="permission-value"></span>
        </div>
        <div class="permission-detail-row">
          <span class="permission-label">Path:</span>
          <span id="permission-path" class="permission-value"></span>
        </div>
      </div>
      <div id="permission-actions">
        <button type="button" class="permission-btn permission-deny" id="btn-permission-deny">Deny</button>
        <button type="button" class="permission-btn permission-allow" id="btn-permission-once">Allow once</button>
        <button type="button" class="permission-btn permission-allow" id="btn-permission-session">Allow for session</button>
        <button type="button" class="permission-btn permission-allow permission-primary" id="btn-permission-always">Allow always</button>
      </div>
    </div>
  </div>

  <script src="js/marked.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/session.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
